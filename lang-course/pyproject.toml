[project]
name = "lang-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DileepLakshn141", email = "dileeplakshan212@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.16",
